<div class="mx-auto max-w-5xl px-5 pt-32 pb-24 sm:px-10">
  <h1 class="font-display text-7xl leading-[0.85] font-black text-kx-osso uppercase sm:text-9xl">
    Contato
  </h1>
  <p class="mt-8 max-w-prose text-xl leading-relaxed text-kx-osso/90">
    Aulas, coreografias, projetos de tecnologia ou parcerias culturais: escolha o canal.
  </p>

  <ul class="mt-12 divide-y divide-kx-roxo/40 border-y border-kx-roxo/40">
    @for (contato of contatos; track contato.rede) {
      <li>
        <a
          [href]="contato.url"
          target="_blank"
          rel="noopener noreferrer"
          class="group flex flex-wrap items-baseline justify-between gap-2 py-8"
        >
          <span
            class="font-display text-5xl font-black text-kx-osso uppercase group-hover:text-kx-rosa sm:text-6xl"
          >
            {{ contato.rede }}
          </span>
          <span class="text-xl text-kx-ciano underline underline-offset-4">
            {{ contato.usuario }}<span class="sr-only"> (abre em nova aba)</span>
          </span>
        </a>
      </li>
    }
  </ul>
</div>
